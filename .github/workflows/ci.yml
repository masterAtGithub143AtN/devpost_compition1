name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install python-dotenv colorama
    
    - name: Check Python syntax
      run: |
        python -m py_compile config.py
        python -m py_compile elasticsearch_client.py
        python -m py_compile gemini_client.py
        python -m py_compile search_assistant.py
        python -m py_compile cli.py
        python -m py_compile index_sample_data.py
        python -m py_compile example.py
        python -m py_compile validate.py
        python -m py_compile demo.py
    
    - name: Run validation script
      run: python validate.py
    
    - name: Check code style (optional)
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
    
    - name: Run demo
      run: python demo.py | head -50

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      run: docker build -t ai-search-assistant:test .
    
    - name: Test Docker image
      run: |
        docker run --rm ai-search-assistant:test python validate.py

  documentation:
    name: Check Documentation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Check README exists
      run: test -f README.md
    
    - name: Check QUICKSTART exists
      run: test -f QUICKSTART.md
    
    - name: Check ARCHITECTURE exists
      run: test -f ARCHITECTURE.md
    
    - name: Check DEPLOYMENT exists
      run: test -f DEPLOYMENT.md
    
    - name: Verify documentation completeness
      run: |
        grep -q "Installation" README.md
        grep -q "Usage" README.md
        grep -q "Features" README.md
        grep -q "Hybrid Search" README.md
